    <!-- Page Wrapper -->
    <div id="page-wrapper">

        <!-- Header -->
        <header id="header">
            <h1><a href="index.html">Hopkins Emergency Response Organization</a></h1>
            <nav id="nav">
                <ul>
                    <li class="special">
                        <a href="#menu" class="menuToggle"><span>Menu</span></a>

        <!-- Main -->
        <article id="main">
            <header>
                <h2>Member Updates</h2>
            </header>
            <section class="wrapper style5">
                <div class="inner">
                    <!-- Carousel -->
                    <div id="myCarousel" class="carousel slide" data-ride="carousel">  <!-- Ensure carousel slides automatically -->
                        <!-- Indicators -->
                        <ol class="carousel-indicators">
                            <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                            <li data-target="#myCarousel" data-slide-to="1"></li>
                            <li data-target="#myCarousel" data-slide-to="2"></li>
                        </ol>

                        <!-- Wrapper for slides -->
                        <div class="carousel-inner">
                            <div class="item active">
                                <img src="images/2023HEROSQUAD.jpeg" alt="CPR Class" style="width:100%;">
                                <div class="carousel-caption">
                                    <h1>HERO 2023 Squad!</h1>
                                </div>
                            </div>
                            <div class="item">
                                <img src="images/2023hero.JPEG" alt="HERO 2024 Squad" style="width:100%;">
                                <div class="carousel-caption">
                                    <h1>HERO 2024 Squad</h1>
                                </div>
                            </div>
                            <div class="item">
                                <img src="images/2023NEWCLASS.jpeg" alt="HERO 2019 Squad" style="width:100%;">
                                <div class="carousel-caption">
                                    <h1>2024 New HERO Class</h1>
                                </div>
                            </div>
                        </div>

                        <!-- Controls -->
                        <a class="left carousel-control" href="#myCarousel" data-slide="prev">
                            <span class="glyphicon glyphicon-chevron-left"></span>
                        </a>
                        <a class="right carousel-control" href="#myCarousel" data-slide="next">
                            <span class="glyphicon glyphicon-chevron-right"></span>
                        </a>
                    </div>
                </div>

    <!-- jQuery and Bootstrap JavaScript via CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Initialize Carousel -->
    <script>
        $(document).ready(function() {
            $('#myCarousel').carousel({
                interval: 3000 // Carousel auto slide every 3 seconds
            });
        });
    </script>
